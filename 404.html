<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d7a6f">
  <title>Page not found | Rwendo</title>
  <style>
    :root{--bg:#f3f6f4;--card:#fff;--text:#17201c;--muted:#66736b;--border:#d8e0db;--brand:#0d7a6f}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);line-height:1.6;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      display:grid;place-items:center;min-height:100vh;padding:24px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;
      padding:28px;max-width:430px;text-align:center}
    img{width:56px;height:56px;border-radius:14px}
    h1{margin:14px 0 6px;font-size:1.3rem}
    p{margin:0 0 18px;color:var(--muted);font-size:.95rem}
    a{display:inline-block;text-decoration:none;font-weight:700;color:#fff;
      background:var(--brand);padding:11px 18px;border-radius:12px}
  </style>
</head>
<body>
  <div class="card">
    <img src="icon-192.png" alt="">
    <h1>This page took a wrong turn</h1>
    <p>We could not find that page. Your hours are safe — head back to the tracker.</p>
    <a href="./">Back to Rwendo</a>
  </div>
</body>
</html>
